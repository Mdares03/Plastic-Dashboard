; MIS Control Tower — ESP32 cabinet edge reader (plan §A).
; A dumb, store-and-forward reader: it timestamps relay transitions and ships them
; to the Pi over MQTT. NO cycle/business logic lives here — see edge/esp32-reader/README.md.
;
; Flash:  pio run -t upload      Monitor:  pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
build_flags =
    ; Edge/heartbeat JSON envelopes are small (~200B) but give MQTT headroom.
    -DMQTT_MAX_PACKET_SIZE=512
