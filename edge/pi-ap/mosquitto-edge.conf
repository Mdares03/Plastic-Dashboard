# Edge split E2 (plan §B): local Mosquitto broker on the Pi for the ESP32 link.
# Separate from the CLOUD EMQX broker the flow already uses for settings/WO push.
# Install:  sudo apt install mosquitto
# Place as: /etc/mosquitto/conf.d/edge.conf  then: sudo systemctl restart mosquitto

# Listen on the Pi AP interface only (the WPA2 AP is the security boundary).
listener 1883 0.0.0.0
# The ESP32 has no credential store on the bench; the closed Pi-AP gates access.
# Tighten to username/password (password_file) before any shared-network deploy.
allow_anonymous true

# Keep the broker lightweight; persistence not needed (durability is the Pi
# edge_inbound table + the ESP32 flash buffer, not the broker).
persistence false
max_queued_messages 1000
