# Edge split E2 (plan §B): DHCP for the Pi AP so the ESP32 gets an address and
# the gateway (the Pi = 192.168.4.1, which CFG_MQTT_HOST points at).
# Place as /etc/dnsmasq.d/edge.conf  then: sudo systemctl restart dnsmasq
#
# Match `interface` to hostapd's AP interface. Give the AP interface the static
# address 192.168.4.1 (e.g. via dhcpcd.conf or systemd-networkd) before starting.

interface=wlan1
dhcp-range=192.168.4.10,192.168.4.50,255.255.255.0,24h
dhcp-option=3,192.168.4.1   # gateway = Pi
# No upstream DNS needed on this isolated link.
no-resolv
