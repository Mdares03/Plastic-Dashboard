# Edge split E2 (plan §B): Pi WiFi AP the ESP32 joins. WPA2 is the link's
# security boundary. Place as /etc/hostapd/hostapd.conf.
#
# INTERFACE LAYOUT (dual-uplink design): the AP lives on the Pi's BUILT-IN WiFi
# (wlan0), fixed at 192.168.4.1, so the ESP32's CFG_MQTT_HOST never changes no
# matter how the Pi reaches the cloud. The cloud uplink is whatever is plugged
# in: eth0 (preferred, no extra hardware) OR a USB WiFi dongle (wlan1) for
# WiFi-only sites. wlan1 is then a normal STA managed by NetworkManager /
# wpa_supplicant — NOT configured here. The Pi must keep internet to flush the
# outbox.
#
# Pin interface names by MAC (built-in vs dongle can swap on boot) with a
# systemd .link file or udev rule so the built-in radio is always wlan0.

interface=wlan0
driver=nl80211
ssid=mis-edge-ap
hw_mode=g
channel=6
country_code=MX
auth_algs=1
wmm_enabled=1

# WPA2-PSK. Change the passphrase and mirror it into the ESP32 config
# (CFG_WIFI_PASS / NVS wifiPass).
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=change-me-on-bench
