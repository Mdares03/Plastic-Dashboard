# Edge split E2 (plan §B): Pi WiFi AP the ESP32 joins. WPA2 is the link's
# security boundary. Place as /etc/hostapd/hostapd.conf.
#
# INTERFACE NOTE: this radio becomes the AP. If the Pi currently reaches the
# cloud over its built-in wlan0, give the AP a DEDICATED interface (a USB WiFi
# dongle, e.g. wlan1) and keep wlan0/ethernet as the cloud uplink — the Pi must
# still reach the internet to flush the outbox. Set `interface` accordingly.

interface=wlan1
driver=nl80211
ssid=mis-edge-ap
hw_mode=g
channel=6
country_code=MX
auth_algs=1
wmm_enabled=1

# WPA2-PSK. Change the passphrase and mirror it into the ESP32 config
# (CFG_WIFI_PASS / NVS wifiPass).
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=change-me-on-bench
